<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gym Tracker của Luân</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: Arial, sans-serif; background: #111; color: #eee; margin: 0 auto; padding: 12px; max-width: 700px; }
  h1 { color: #f5a623; text-align: center; font-size: 22px; }
  h2 { color: #f5a623; font-size: 18px; margin: 4px 0 10px; }
  .card { background: #1e1e1e; border-radius: 12px; padding: 14px; margin-bottom: 14px; }
  .hidden { display: none !important; }
  .ex { border-bottom: 1px solid #333; padding: 10px; border-radius: 8px; }
  .ex.done { background: #2e4d2e; }
  .ex-name { font-weight: bold; font-size: 15px; }
  .ex-info { font-size: 13px; color: #aaa; margin: 4px 0 6px; }
  .last { font-size: 12px; color: #888; margin-bottom: 6px; }
  .set { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
  .set span { width: 52px; font-size: 14px; }
  .set input { flex: 1; padding: 8px; font-size: 16px; border-radius: 8px; border: none; background: #2b2b2b; color: #fff; min-width: 0; }
  select, input[type=date], button { font-size: 16px; padding: 10px; border-radius: 8px; border: none; width: 100%; margin-bottom: 8px; }
  select, input[type=date] { background: #2b2b2b; color: #fff; }
  button { background: #f5a623; font-weight: bold; cursor: pointer; }
  button.gray { background: #333; color: #eee; }
  #timer { font-size: 34px; text-align: center; color: #f5a623; font-weight: bold; margin: 6px 0; }
  .bar-row { display: flex; align-items: center; gap: 8px; margin: 5px 0; font-size: 12px; }
  .bar-label { width: 50px; color: #aaa; }
  .bar { height: 16px; background: #f5a623; border-radius: 4px; }
  .bar-val { white-space: nowrap; }
  #userInfo { font-size: 13px; color: #aaa; }
</style>
</head>
<body>
  <h1>🏋️ Gym Tracker của Luân</h1>

  <div class="card" id="loginCard">
    <p>Đăng nhập bằng Google để đồng bộ giữa điện thoại và máy tính.</p>
    <button onclick="login()">Đăng nhập bằng Google</button>
  </div>

  <div id="appArea" class="hidden">
    <div class="card">
      <div id="userInfo"></div>
      <button class="gray" onclick="logout()">Đăng xuất</button>
    </div>

    <div class="card hidden" id="migrateCard">
      <p>Máy này còn dữ liệu cũ (bản chưa đồng bộ). Bấm nút dưới để chuyển lên đám mây.</p>
      <button onclick="migrateLocal()">Chuyển dữ liệu cũ lên đám mây</button>
    </div>

    <div class="card">
      <h2>Ghi buổi tập</h2>
      <input type="date" id="dateInput" onchange="onDateChange()">
      <select id="daySelect" onchange="renderWorkout()"></select>
      <div id="workout"></div>
    </div>

    <div class="card">
      <h2>⏱️ Đồng hồ nghỉ</h2>
      <div id="timer">--</div>
      <button onclick="startRest(90)">Nghỉ 90 giây</button>
      <button class="gray" onclick="startRest(60)">Nghỉ 60 giây</button>
    </div>

    <div class="card">
      <h2>📈 Tiến độ theo bài</h2>
      <select id="progressSelect" onchange="renderProgress()"></select>
      <div id="progress"></div>
    </div>

    <div class="card">
      <h2>💾 Sao lưu</h2>
      <button onclick="exportData()">Xuất ra file</button>
      <button class="gray" onclick="document.getElementById('importFile').click()">Nhập từ file</button>
      <input type="file" id="importFile" accept=".json" class="hidden" onchange="importData(event)">
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager,
             collection, doc, setDoc, onSnapshot }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAJTVdfIaogCbSkog4SgLhXaq1K5jMm9dQ",
      authDomain: "gym-tracker-39b78.firebaseapp.com",
      projectId: "gym-tracker-39b78",
      storageBucket: "gym-tracker-39b78.firebasestorage.app",
      messagingSenderId: "360974190701",
      appId: "1:360974190701:web:092f8e3dd1641571be5764"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = initializeFirestore(app, {
      localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() })
    });

    const DAY_NAMES = { 1: "Thứ 2", 2: "Thứ 3", 3: "Thứ 4", 4: "Thứ 5", 5: "Thứ 6", 6: "Thứ 7", 0: "Chủ nhật" };

    const WORKOUTS = {
      1: { name: "Buổi 1 – PUSH (Đẩy: Ngực, Vai, Tay sau)", exercises: [
        ["Incline Machine Chest Press (Đẩy ngực máy nghiêng 30 độ)", 4, "8–10"],
        ["Chest Press Machine (Đẩy ngực máy ngang)", 3, "8–10"],
        ["Seated Dumbbell Press (Đẩy vai tạ đơn ngồi)", 3, "8–12"],
        ["Cable Lateral Raise (Nâng vai ngang cáp)", 4, "12–15"],
        ["Skull Crusher (Duỗi tay nằm thanh EZ)", 3, "10–12"],
        ["Overhead Cable Triceps Extension (Duỗi tay sau qua đầu bằng cáp)", 3, "12–15"]
      ]},
      2: { name: "Buổi 2 – PULL (Kéo: Lưng, Vai sau, Tay trước)", exercises: [
        ["Pull-up Neutral Grip (Hít xà tay cầm song song)", 4, "8–10"],
        ["Chest-Supported Row (Kéo lưng có tựa ngực)", 4, "10–12"],
        ["Lat Pulldown Wide Grip (Kéo xô tay cầm rộng)", 3, "10–12"],
        ["Reverse Pec Deck (Máy ép ngực ngược)", 3, "12–15"],
        ["Face Pull (Kéo cáp về mặt)", 3, "12–15"],
        ["Incline Dumbbell Curl (Cuốn tạ đơn ghế dốc)", 3, "12–15"],
        ["Preacher Curl (Cuốn bắp tay trước ghế dốc)", 3, "12–15"]
      ]},
      3: { name: "Buổi 3 – LEGS (Chân: Đùi trước, Đùi sau, Mông)", exercises: [
        ["Reverse Hack Squat (Hack Squat úp ngược)", 4, "8–10"],
        ["Hip Thrust (Đẩy hông)", 4, "10–12"],
        ["Leg Press mid foot (Đạp đùi máy, đặt chân giữa)", 3, "10–12"],
        ["Romanian Deadlift – RDL (Kéo tạ đòn chân thẳng)", 3, "8–10"],
        ["Leg Extension (Đá đùi trước)", 3, "12–15"],
        ["Seated Leg Curl (Móc đùi sau ngồi)", 3, "12–15"],
        ["Standing Calf Raise (Nhún bắp chân đứng)", 3, "12–15"]
      ]},
      5: { name: "Buổi 4 – UPPER (Thân trên, tập nhẹ hơn)", exercises: [
        ["Incline Dumbbell Press (Đẩy tạ đơn ghế dốc)", 3, "8–12"],
        ["Single-Arm Dumbbell Row (Kéo tạ đơn 1 tay)", 3, "10–12"],
        ["Cable Crossover high-to-low (Ép ngực cáp từ cao xuống thấp)", 3, "12–15"],
        ["Dumbbell Lateral Raise (Nâng vai ngang tạ đơn)", 3, "12–15"],
        ["Cable Hammer Curl (Cuốn búa cáp)", 3, "12–15"],
        ["Triceps Cable Rope Pushdown (Kéo cáp tay sau)", 3, "12–15"],
        ["Hanging Knee Raise (Gập bụng treo người)", 3, "12–15"]
      ]},
      6: { name: "Buổi 5 – LOWER (Thân dưới, bổ trợ)", exercises: [
        ["Leg Press mid foot (Đạp đùi máy, đặt chân giữa)", 3, "10–12"],
        ["Lying Leg Curl (Móc đùi sau nằm)", 3, "10–12"],
        ["Leg Extension (Đá đùi trước)", 3, "12–15"],
        ["45° Back Extension (Gập lưng 45°)", 3, "12–15"],
        ["Seated Calf Raise (Nhún bắp chân ngồi)", 4, "15–20"],
        ["Cable Crunch (Gập bụng cáp)", 3, "12–15"]
      ]}
    };

    let uid = null;
    let logs = {};
    let unsubscribe = null;
    let selectedDate = todayKey();

    function todayKey() {
      const d = new Date();
      return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
    }

    function dayOfWeek(dateStr) {
      const [y, m, d] = dateStr.split("-").map(Number);
      return new Date(y, m - 1, d).getDay();
    }

    function maxWeight(sets) {
      let m = 0;
      (sets || []).forEach(s => { if (s && s.w && s.w > m) m = s.w; });
      return m;
    }

    function getLastSets(name) {
      const dates = Object.keys(logs)
        .filter(d => d < selectedDate && logs[d][name])
        .sort();
      return dates.length ? logs[dates[dates.length - 1]][name] : null;
    }

    // ---------- Đăng nhập ----------
    window.login = () => {
      signInWithPopup(auth, new GoogleAuthProvider()).catch(e => alert("Đăng nhập lỗi: " + e.message));
    };
    window.logout = () => signOut(auth);

    onAuthStateChanged(auth, user => {
      if (user) {
        uid = user.uid;
        document.getElementById("loginCard").classList.add("hidden");
        document.getElementById("appArea").classList.remove("hidden");
        document.getElementById("userInfo").textContent = "Đang đăng nhập: " + (user.email || "");
        startSync();
        checkLocalData();
      } else {
        uid = null;
        logs = {};
        if (unsubscribe) unsubscribe();
        document.getElementById("loginCard").classList.remove("hidden");
        document.getElementById("appArea").classList.add("hidden");
      }
    });

    // ---------- Đồng bộ đám mây ----------
    function startSync() {
      if (unsubscribe) unsubscribe();
      unsubscribe = onSnapshot(collection(db, "users", uid, "days"), snap => {
        logs = {};
        snap.forEach(d => { logs[d.id] = d.data().exercises || {}; });
        renderAll();
      });
    }

    async function saveDay(date) {
      try {
        await setDoc(doc(db, "users", uid, "days", date), { exercises: logs[date] || {} });
      } catch (e) {
        alert("Lưu lỗi: " + e.message);
      }
    }

    // ---------- Ghi buổi tập ----------
    window.onDateChange = () => {
      selectedDate = document.getElementById("dateInput").value;
      document.getElementById("daySelect").value = dayOfWeek(selectedDate);
      renderAll();
    };

    window.updateSet = (day, i, s, field, value) => {
      const name = WORKOUTS[day].exercises[i][0];
      if (!logs[selectedDate]) logs[selectedDate] = {};
      if (!logs[selectedDate][name]) logs[selectedDate][name] = [];
      const arr = logs[selectedDate][name];
      for (let k = 0; k <= s; k++) if (!arr[k]) arr[k] = { w: null, r: null };
      arr[s][field] = value === "" ? null : Number(value);
      renderAll();
      saveDay(selectedDate);
    };

    window.renderWorkout = () => {
      const day = Number(document.getElementById("daySelect").value);
      const w = WORKOUTS[day];
      const box = document.getElementById("workout");

      if (!w) {
        box.innerHTML = "<p>Ngày này là ngày nghỉ. Nghỉ cũng là một phần của tập luyện 😄</p>";
        return;
      }

      const dayLog = logs[selectedDate] || {};
      let html = `<p class="ex-info"><b>${w.name}</b></p>`;

      w.exercises.forEach(([name, sets, reps], i) => {
        const cur = dayLog[name] || [];
        let done = true;
        for (let s = 0; s < sets; s++) {
          if (!cur[s] || !cur[s].w || !cur[s].r) { done = false; break; }
        }

        const last = getLastSets(name);
        const lastText = last ? `<div class="last">Lần trước: tạ cao nhất ${maxWeight(last)}kg</div>` : "";

        let rows = "";
        for (let s = 0; s < sets; s++) {
          const c = cur[s] || {};
          rows += `
            <div class="set">
              <span>Set ${s + 1}</span>
              <input type="number" inputmode="decimal" step="0.5" placeholder="kg"
                value="${c.w ?? ""}" onchange="updateSet(${day}, ${i}, ${s}, 'w', this.value)">
              <input type="number" inputmode="numeric" placeholder="reps"
                value="${c.r ?? ""}" onchange="updateSet(${day}, ${i}, ${s}, 'r', this.value)">
            </div>`;
        }

        html += `
          <div class="ex ${done ? "done" : ""}">
            <div class="ex-name">${i + 1}. ${name} ${done ? "✅" : ""}</div>
            <div class="ex-info">${sets} set × ${reps} reps</div>
            ${lastText}
            ${rows}
          </div>`;
      });

      box.innerHTML = html;
    };

    // ---------- Tiến độ ----------
    window.renderProgress = () => {
      const name = document.getElementById("progressSelect").value;
      const box = document.getElementById("progress");
      const dates = Object.keys(logs)
        .filter(d => logs[d][name] && maxWeight(logs[d][name]) > 0)
        .sort();

      if (!dates.length) {
        box.innerHTML = "<p>Chưa có dữ liệu cho bài này.</p>";
        return;
      }

      const values = dates.map(d => maxWeight(logs[d][name]));
      const max = Math.max(...values);

      box.innerHTML = dates.map((d, idx) => {
        const [, m, day] = d.split("-");
        const width = (values[idx] / max) * 100;
        return `
          <div class="bar-row">
            <span class="bar-label">${day}/${m}</span>
            <div class="bar" style="width:${width}%"></div>
            <span class="bar-val">${values[idx]}kg</span>
          </div>`;
      }).join("");
    };

    function renderAll() {
      document.getElementById("dateInput").value = selectedDate;
      renderWorkout();
      renderProgress();
    }

    // ---------- Đồng hồ nghỉ ----------
    let timerId = null;
    window.startRest = (sec) => {
      clearInterval(timerId);
      let left = sec;
      const el = document.getElementById("timer");
      el.textContent = left + "s";
      timerId = setInterval(() => {
        left--;
        el.textContent = left + "s";
        if (left <= 0) {
          clearInterval(timerId);
          el.textContent = "Hết giờ! 💪";
          if (navigator.vibrate) navigator.vibrate([300, 150, 300]);
        }
      }, 1000);
    };

    // ---------- Chuyển dữ liệu cũ ----------
    function checkLocalData() {
      const old = JSON.parse(localStorage.getItem("gymLogsV2") || "{}");
      if (Object.keys(old).length) document.getElementById("migrateCard").classList.remove("hidden");
    }

    window.migrateLocal = async () => {
      const old = JSON.parse(localStorage.getItem("gymLogsV2") || "{}");
      Object.entries(old).forEach(([key, sets]) => {
        const [date, ...rest] = key.split("|");
        const name = rest.join("|");
        if (!logs[date]) logs[date] = {};
        logs[date][name] = sets;
      });
      for (const date of Object.keys(logs)) await saveDay(date);
      localStorage.setItem("gymLogsV2_backup", localStorage.getItem("gymLogsV2"));
      localStorage.removeItem("gymLogsV2");
      document.getElementById("migrateCard").classList.add("hidden");
      alert("Đã chuyển xong dữ liệu lên đám mây!");
    };

    // ---------- Sao lưu ----------
    window.exportData = () => {
      const blob = new Blob([JSON.stringify(logs, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "gym-backup-" + todayKey() + ".json";
      a.click();
    };

    window.importData = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async () => {
        try {
          const data = JSON.parse(reader.result);
          for (const date of Object.keys(data)) {
            logs[date] = { ...(logs[date] || {}), ...data[date] };
            await saveDay(date);
          }
          alert("Nhập dữ liệu thành công!");
        } catch (err) {
          alert("File không hợp lệ 2 ơi.");
        }
      };
      reader.readAsText(file);
    };

    // ---------- Khởi tạo menu ----------
    function init() {
      const daySel = document.getElementById("daySelect");
      [1, 2, 3, 4, 5, 6, 0].forEach(d => {
        const opt = document.createElement("option");
        opt.value = d;
        opt.textContent = DAY_NAMES[d] + (WORKOUTS[d] ? "" : " (nghỉ)");
        daySel.appendChild(opt);
      });
      daySel.value = dayOfWeek(selectedDate);

      const names = [...new Set(Object.values(WORKOUTS).flatMap(w => w.exercises.map(e => e[0])))];
      const ps = document.getElementById("progressSelect");
      names.forEach(n => {
        const opt = document.createElement("option");
        opt.value = n;
        opt.textContent = n;
        ps.appendChild(opt);
      });
    }

    init();
  </script>
</body>
</html>
